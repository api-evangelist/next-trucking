summary: >-
  Two real documents were retrieved, and both are served by NEXT Trucking's own Auth0 tenant
  (prod-nexttrucking.us.auth0.com): the OpenID Connect discovery document and the RFC 8414
  authorization-server metadata document (Auth0 serves byte-identical bodies at both paths).
  Nothing is served on any nexttrucking.com host: no security.txt, no api-catalog, no OIDC
  discovery, no ai-plugin.json and no A2A agent card anywhere.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the two 200s on prod-nexttrucking.us.auth0.com.
  That host is a tenant NEXT Trucking provisions and the ATLAS application authenticates against
  it (the tenant URL is hard-coded in https://atlas.nexttrucking.com/index.05305cf32fe3cdc18fa6.js),
  so the documents describe this company's identity surface — but the host is an auth0.com
  subdomain, NOT a nexttrucking.com host, and that distinction is recorded here deliberately.
  SecurityTxt pointer NOT emitted: RFC 9116 is unimplemented on every host probed.
false_positive_watch: >-
  app.nexttrucking.com and atlas.nexttrucking.com are S3/CloudFront single-page apps that answer
  HTTP 200 with the application HTML shell for EVERY extensionless /.well-known/* path, and HTTP
  403 (S3 AccessDenied XML) for any path with a file extension. Every one of those 200s is
  recorded below as a MISS, not a hit. A future round that treats one of them as a served
  document is wrong.
