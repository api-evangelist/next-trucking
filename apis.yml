apis:
- name: NEXT ATLAS Platform API
  description: >-
    The service gateway behind NEXT's ATLAS transportation management system and its shipper, carrier
    and managed-carrier portals. Twenty-nine service paths were enumerated from the ATLAS web
    application bundle — including shippers, carrier, delivery-order, trips, appointments, pricing-v2,
    equipment, yards, places, location, document, document-obligation, freight-doc, accessorial-event,
    accounting, ap, exception-management, marketplace-job-distribution and user-management. The
    gateway is real and reachable, but it is not a published product: every service path returns HTTP
    401 to an anonymous request, the Swagger UI asset bundle is served while the OpenAPI documents it
    would render are unrouted (HTTP 404 on /v3/api-docs for every service), and NEXT publishes no
    developer portal, reference or contract. Recorded here as a gated surface, not as an available API.
  humanURL: https://nexttrucking.com/our-technology/
  baseURL: https://svcs.us-west-2.prod.aws.nexttrucking.com
  x-access: gated
  x-access-note: >-
    Discovered by probe, not from documentation. Host and service paths read from
    https://atlas.nexttrucking.com/index.05305cf32fe3cdc18fa6.js; all paths confirmed 401 on
    2026-08-26. No spec is published, so no contract pointer is wired.
  tags:
  - Freight
  - Logistics
  - Drayage
  - Transportation Management
