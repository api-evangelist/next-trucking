aid: next-trucking
name: NEXT Trucking
description: >-
  NEXT Trucking (branded "NEXT") is a FreightTech company founded in 2015 and headquartered in the
  Los Angeles area, operating a digital freight marketplace focused on drayage at the Ports of Los
  Angeles and Long Beach, plus transloading, full-truckload over-the-road and expedited (NEXTpedited)
  service. Its technology core is ATLAS, a proprietary transportation management system that carries
  a container from delivery-order ingestion through job creation, dispatch, billing and payout, and
  that connects shippers, carriers, terminals, yards and chassis providers. The company markets EDI
  and API connectivity alongside its shipper/carrier portals and driver mobile apps, but publishes no
  developer portal, no API reference and no machine-readable contract: its service gateway answers
  every anonymous request with HTTP 401. NEXT was acquired by Chicago-based digital freight broker
  CDL 1000 in February 2024; the nexttrucking.com brand, marketplace and applications remain live.
  Backers before the acquisition included Sequoia Capital, Brookfield Growth, GLP Capital and Mucker
  Capital.
